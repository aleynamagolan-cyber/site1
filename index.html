<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anneler Günü 💜</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#f3e8ff,#fff5ff);
  text-align:center;
  color:#4b2a5a;
}

/* 🔐 şifre ekranı */
#lock{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#a855f7,#f3e8ff);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#lock input{
  padding:10px;
  border:none;
  border-radius:10px;
  margin-top:10px;
  outline:none;
}

#lock button{
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:white;
  cursor:pointer;
}

/* 💜 site */
#site{
  display:none;
  padding:20px;
}

h1{
  color:#a855f7;
  text-shadow:0 0 10px #c084fc;
}

/* 📦 kart */
.card{
  background:white;
  max-width:500px;
  margin:20px auto;
  padding:15px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

img{
  width:100%;
  border-radius:10px;
}

/* 💜 kalpler */
.heart{
  position:fixed;
  font-size:20px;
  animation:float 2s linear forwards;
}

@keyframes float{
  0%{transform:translateY(0);opacity:1;}
  100%{transform:translateY(-200px);opacity:0;}
}
</style>
</head>

<body>

<!-- 🔐 -->
<div id="lock">
  <h2>🔐 Şifreyi gir</h2>
  <input id="pass" type="password" placeholder="şifre">
  <button onclick="check()">Giriş</button>
  <p id="err"></p>
</div>

<!-- 💜 -->
<div id="site">

  <h1>💜 Anneler Günün Kutlu Olsun 💜</h1>

  <div class="card">
    <img src="https://i.hizliresim.com/n0ijnu6.jpeg">
    <p id="text"></p>
  </div>

  <audio id="music" loop>
    <source src="MUSIC_URL_BURAYA.mp3">
  </audio>

</div>

<script>

/* ✍️ yazı */
const text=`hayat bazen bize kan bağı olmadan en güzel bağları kurduruyor...

sen benim için sadece bir abla değil,
zor anımda sığındığım,
mutlu anımda paylaştığım insansın.

varlığın bana hep güç veriyor,
iyi ki hayatımdasın.

💜 anneler günün kutlu olsun balımmm 💜`;

let i=0;

function type(){
  if(i<text.length){
    document.getElementById("text").innerHTML += text[i];
    i++;
    setTimeout(type,40);
  }
}

/* 🔐 şifre */
function check(){
  let p=document.getElementById("pass").value;

  if(p==="1234"){
    document.getElementById("lock").style.display="none";
    document.getElementById("site").style.display="block";
    document.getElementById("music").play();
    type();
  }else{
    document.getElementById("err").innerText="Yanlış şifre ❌";
  }
}

/* 💜 kalpler */
setInterval(()=>{
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💜";
  h.style.left=Math.random()*100+"vw";
  h.style.top="100vh";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),2000);
},300);

</script>

</body>
</html>
